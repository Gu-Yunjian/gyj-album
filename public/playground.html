<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片自由摆放 - GU Album</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      
      --bg-primary: #F5F5F5;
      --bg-secondary: #FFFFFF;
      --text-primary: #000000;
      --text-secondary: rgba(0, 0, 0, 0.5);
      --border: rgba(0, 0, 0, 0.1);
      
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      
      --transition-fast: 150ms ease-out;
      --transition-base: 300ms ease-out;
      --transition-slow: 500ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      height: 100%;
      font-family: var(--font-family);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      user-select: none;
    }
    
    /* ===== Navigation ===== */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-xl);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.05);
      z-index: 1000;
    }
    
    .nav-brand {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    
    .nav-links {
      display: flex;
      gap: var(--space-lg);
    }
    
    .nav-link {
      font-size: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color var(--transition-fast);
      position: relative;
    }
    
    .nav-link:hover {
      color: var(--text-primary);
    }
    
    /* ===== Canvas ===== */
    .canvas {
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
    }
    
    /* ===== Photo Card (Polaroid) ===== */
    .photo-card {
      position: absolute;
      background: white;
      padding: 12px 12px 48px 12px;
      border-radius: 2px;
      box-shadow: 
        0 4px 6px rgba(0, 0, 0, 0.05),
        0 10px 20px rgba(0, 0, 0, 0.08);
      cursor: grab;
      will-change: transform;
      touch-action: none;
      transform-origin: center center;
    }
    
    .photo-card:hover {
      box-shadow: 
        0 8px 12px rgba(0, 0, 0, 0.08),
        0 16px 32px rgba(0, 0, 0, 0.12);
    }
    
    .photo-card.dragging {
      cursor: grabbing;
      z-index: 9999 !important;
      transition: none !important;
    }
    
    .photo-card img {
      display: block;
      width: auto;
      height: auto;
      max-width: 260px;
      max-height: 300px;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    
    /* 放大状态的照片 */
    .photo-card.zoomed {
      z-index: 10000 !important;
      cursor: default;
    }
    
    /* ===== Expanded Background ===== */
    .expanded-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      z-index: 9998;
      pointer-events: none;
      transition: background var(--transition-base);
    }
    
    .expanded-bg.active {
      background: rgba(0, 0, 0, 0.9);
      pointer-events: auto;
    }
    
    /* ===== Close Button ===== */
    .close-btn {
      position: fixed;
      top: 80px;
      right: 32px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.8);
      transition: all var(--transition-base);
      z-index: 10001;
      pointer-events: none;
    }
    
    .close-btn.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    /* ===== Nav Arrows ===== */
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%) scale(0.8);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 20px;
      cursor: pointer;
      opacity: 0;
      transition: all var(--transition-base);
      z-index: 10001;
      pointer-events: none;
    }
    
    .nav-arrow.visible {
      opacity: 1;
      transform: translateY(-50%) scale(1);
      pointer-events: auto;
    }
    
    .nav-arrow:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .nav-arrow.prev { left: 32px; }
    .nav-arrow.next { right: 32px; }
    
    /* ===== Controls ===== */
    .controls {
      position: fixed;
      bottom: var(--space-xl);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: var(--space-md);
      z-index: 100;
      padding: var(--space-md) var(--space-lg);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 100px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    
    .btn {
      padding: 10px 20px;
      font-size: 13px;
      font-family: var(--font-family);
      font-weight: 400;
      color: var(--text-primary);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 100px;
      cursor: pointer;
      transition: all var(--transition-base);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .btn:hover {
      background: var(--text-primary);
      color: var(--bg-secondary);
      border-color: var(--text-primary);
    }
    
    .btn-primary {
      background: var(--text-primary);
      color: var(--bg-secondary);
      border-color: var(--text-primary);
    }
    
    /* ===== Hint ===== */
    .hint {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 100px;
      font-size: 12px;
      color: var(--text-secondary);
      pointer-events: none;
      opacity: 0.8;
      transition: opacity var(--transition-slow);
    }
    
    .hint.hidden {
      opacity: 0;
    }
    
    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .nav { padding: 0 var(--space-md); }
      .controls { bottom: var(--space-lg); padding: var(--space-sm) var(--space-md); }
      .btn { padding: 8px 16px; font-size: 12px; }
      .photo-card { padding: 8px 8px 36px 8px; }
      .photo-card img { max-width: 180px; max-height: 220px; }
      .close-btn { top: 72px; right: 16px; }
      .nav-arrow.prev { left: 16px; }
      .nav-arrow.next { right: 16px; }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="nav">
    <a href="/" class="nav-brand">GU YUN-JIAN</a>
    <div class="nav-links">
      <a href="/" class="nav-link">首页</a>
      <a href="/collections" class="nav-link">影集</a>
      <a href="/about" class="nav-link">关于</a>
    </div>
  </nav>
  
  <!-- Hint -->
  <div class="hint" id="hint">拖拽调整位置，点击查看大图</div>
  
  <!-- Expanded Background -->
  <div class="expanded-bg" id="expandedBg"></div>
  
  <!-- Close Button -->
  <button class="close-btn" id="closeBtn">×</button>
  
  <!-- Nav Arrows -->
  <button class="nav-arrow prev" id="prevBtn">‹</button>
  <button class="nav-arrow next" id="nextBtn">›</button>
  
  <!-- Canvas -->
  <div class="canvas" id="canvas"></div>
  
  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-primary" id="resetBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/>
        <path d="M3 3v9h9"/>
      </svg>
      重置布局
    </button>
    <button class="btn" id="shuffleBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
      </svg>
      换一组
    </button>
  </div>

  <script>
    // ===== Photo Data =====
    const allPhotos = [
      'medium/111/1773244921289-xjpckw.webp',
      'medium/111/1773244921364-be9ehq.webp',
      'medium/111/1773244921401-3blicm.webp',
      'medium/111/1773244921517-qngo9q.webp',
      'medium/111/1773244921677-t1nkqp.webp',
      'medium/111/1773244921845-ggge7o.webp',
      'medium/111/1773244921988-r2fl94.webp',
      'medium/111/1773244922079-1uoct1.webp',
      'medium/ceshi1/independent_photos__103_.webp',
      'medium/ceshi1/independent_photos__104_.webp',
      'medium/ceshi1/independent_photos__105_.webp',
      'medium/ceshi1/independent_photos__106_.webp',
      'medium/ceshi1/independent_photos__109_.webp',
      'medium/ceshi1/independent_photos__110_.webp',
      'medium/ceshi1/independent_photos__111_.webp',
      'medium/ceshi1/independent_photos__112_.webp',
      'medium/ceshi1/independent_photos__113_.webp',
      'medium/ceshi1/independent_photos__117_.webp',
      'medium/ceshi1/independent_photos__118_.webp',
      'medium/ceshi1/independent_photos__119_.webp',
      'medium/ceshi1/independent_photos__120_.webp',
      'medium/default/1773242301939-xp32yx.webp',
      'medium/default/1773242302220-ze79me.webp',
      'medium/default/1773242302467-kung5c.webp',
      'medium/default/1773242302532-n0qpcs.webp',
      'medium/default/1773242302587-jf5obr.webp',
      'medium/default/1773242302639-o8b6sa.webp',
      'medium/default/1773242302704-yz4l9y.webp',
      'medium/default/1773242302767-mu3zp1.webp',
      'medium/default/1773242302807-pxj8cm.webp'
    ];
    
    // ===== State =====
    let currentPhotos = [];
    let photoCards = [];
    let zIndexCounter = 100;
    let expandedIndex = -1;
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };
    let currentDragElement = null;
    let hasDragged = false;
    
    const canvas = document.getElementById('canvas');
    const expandedBg = document.getElementById('expandedBg');
    const closeBtn = document.getElementById('closeBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const hint = document.getElementById('hint');
    
    // ===== Utility Functions =====
    function shuffleArray(array) {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    }
    
    function getRandomPhotos(n) {
      const shuffled = shuffleArray(allPhotos);
      return shuffled.slice(0, n);
    }
    
    function getRandomPosition(index, total) {
      const canvasRect = canvas.getBoundingClientRect();
      const centerX = canvasRect.width / 2;
      const centerY = canvasRect.height / 2;
      
      const angle = (index / total) * Math.PI * 2;
      const radius = 140 + Math.random() * 80;
      
      const x = centerX + Math.cos(angle) * radius - 130 + (Math.random() - 0.5) * 80;
      const y = centerY + Math.sin(angle) * radius - 150 + (Math.random() - 0.5) * 80;
      
      return {
        x: Math.max(20, Math.min(canvasRect.width - 280, x)),
        y: Math.max(20, Math.min(canvasRect.height - 320, y))
      };
    }
    
    function getRandomRotation() {
      return (Math.random() - 0.5) * 12;
    }
    
    // ===== Create Photo Card =====
    function createPhotoCard(photoPath, index, total) {
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.dataset.index = index;
      card.dataset.rotation = getRandomRotation();
      
      const pos = getRandomPosition(index, total);
      const rotation = parseFloat(card.dataset.rotation);
      
      card.style.left = `${pos.x}px`;
      card.style.top = `${pos.y}px`;
      card.style.transform = `rotate(${rotation}deg)`;
      card.style.zIndex = zIndexCounter++;
      
      const img = document.createElement('img');
      img.src = photoPath;
      img.alt = `照片 ${index + 1}`;
      img.draggable = false;
      
      card.appendChild(img);
      
      // Events
      card.addEventListener('mousedown', handleMouseDown);
      card.addEventListener('touchstart', handleTouchStart, { passive: false });
      
      return card;
    }
    
    // ===== Drag Handlers =====
    function handleMouseDown(e) {
      if (e.button !== 0) return;
      if (expandedIndex !== -1) return;
      
      e.preventDefault();
      hasDragged = false;
      startDrag(e.currentTarget, e.clientX, e.clientY);
    }
    
    function handleTouchStart(e) {
      if (expandedIndex !== -1) return;
      e.preventDefault();
      hasDragged = false;
      const touch = e.touches[0];
      startDrag(e.currentTarget, touch.clientX, touch.clientY);
    }
    
    function startDrag(element, clientX, clientY) {
      isDragging = true;
      currentDragElement = element;
      
      const rect = element.getBoundingClientRect();
      dragOffset.x = clientX - rect.left;
      dragOffset.y = clientY - rect.top;
      
      element.style.zIndex = zIndexCounter++;
      element.classList.add('dragging');
      hint.classList.add('hidden');
    }
    
    function handleMouseMove(e) {
      if (!isDragging || !currentDragElement) return;
      e.preventDefault();
      
      hasDragged = true;
      moveDrag(e.clientX, e.clientY);
    }
    
    function handleTouchMove(e) {
      if (!isDragging || !currentDragElement) return;
      e.preventDefault();
      
      hasDragged = true;
      const touch = e.touches[0];
      moveDrag(touch.clientX, touch.clientY);
    }
    
    function moveDrag(clientX, clientY) {
      if (!currentDragElement) return;
      
      const canvasRect = canvas.getBoundingClientRect();
      const rotation = parseFloat(currentDragElement.dataset.rotation) || 0;
      
      let x = clientX - canvasRect.left - dragOffset.x;
      let y = clientY - canvasRect.top - dragOffset.y;
      
      currentDragElement.style.left = `${x}px`;
      currentDragElement.style.top = `${y}px`;
    }
    
    function handleMouseUp(e) {
      if (!isDragging) return;
      
      const wasDragging = hasDragged;
      endDrag();
      
      // 如果没有拖拽（只是点击），则放大
      if (!wasDragging && e.target.closest('.photo-card')) {
        const card = e.target.closest('.photo-card');
        expandPhoto(card);
      }
    }
    
    function handleTouchEnd(e) {
      if (!isDragging) return;
      
      const wasDragging = hasDragged;
      endDrag();
      
      if (!wasDrag) {
        // For touch, we need to check if it's a tap
        setTimeout(() => {
          if (!hasDragged && currentDragElement) {
            expandPhoto(currentDragElement);
          }
        }, 0);
      }
    }
    
    function endDrag() {
      if (!currentDragElement) return;
      
      const rotation = parseFloat(currentDragElement.dataset.rotation) || 0;
      currentDragElement.classList.remove('dragging');
      
      isDragging = false;
      currentDragElement = null;
    }
    
    // ===== Expand Photo (Seamless Animation) =====
    function expandPhoto(card) {
      if (expandedIndex !== -1) return;
      
      expandedIndex = parseInt(card.dataset.index);
      const img = card.querySelector('img');
      
      // Show background and controls
      expandedBg.classList.add('active');
      setTimeout(() => {
        closeBtn.classList.add('visible');
        prevBtn.classList.add('visible');
        nextBtn.classList.add('visible');
      }, 300);
      
      // Calculate positions for FLIP animation
      const rect = card.getBoundingClientRect();
      const viewportW = window.innerWidth;
      const viewportH = window.innerHeight;
      
      // Calculate target size (fit within 85vw x 80vh)
      const imgNaturalW = img.naturalWidth || 1200;
      const imgNaturalH = img.naturalHeight || 800;
      
      const maxW = viewportW * 0.85;
      const maxH = viewportH * 0.8;
      
      const scale = Math.min(maxW / imgNaturalW, maxH / imgNaturalH, 1);
      const targetW = imgNaturalW * scale;
      const targetH = imgNaturalH * scale;
      
      const targetX = (viewportW - targetW) / 2;
      const targetY = (viewportH - targetH) / 2;
      
      // Store original styles
      card.dataset.origLeft = card.style.left;
      card.dataset.origTop = card.style.top;
      card.dataset.origTransform = card.style.transform;
      card.dataset.origZIndex = card.style.zIndex;
      
      // Apply animation
      card.classList.add('zoomed');
      card.style.transition = 'all 500ms cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      card.style.zIndex = 10000;
      
      // Force reflow
      card.offsetHeight;
      
      // Animate to center
      card.style.left = `${targetX}px`;
      card.style.top = `${targetY}px`;
      card.style.transform = 'rotate(0deg) scale(1)';
      
      // Adjust padding for expanded view
      card.style.padding = '0';
      img.style.maxWidth = `${targetW}px`;
      img.style.maxHeight = `${targetH}px`;
    }
    
    // ===== Collapse Photo =====
    function collapsePhoto() {
      if (expandedIndex === -1) return;
      
      const card = photoCards[expandedIndex];
      
      // Hide controls
      closeBtn.classList.remove('visible');
      prevBtn.classList.remove('visible');
      nextBtn.classList.remove('visible');
      expandedBg.classList.remove('active');
      
      // Restore original styles
      card.style.transition = 'all 400ms cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      card.style.left = card.dataset.origLeft;
      card.style.top = card.dataset.origTop;
      card.style.transform = card.dataset.origTransform;
      card.style.zIndex = card.dataset.origZIndex;
      card.style.padding = '';
      
      const img = card.querySelector('img');
      img.style.maxWidth = '';
      img.style.maxHeight = '';
      
      setTimeout(() => {
        card.classList.remove('zoomed');
        card.style.transition = '';
        expandedIndex = -1;
      }, 400);
    }
    
    // ===== Navigate Expanded Photos =====
    function navigateExpanded(direction) {
      if (expandedIndex === -1) return;
      
      const currentCard = photoCards[expandedIndex];
      
      // Calculate new index
      const newIndex = (expandedIndex + direction + photoCards.length) % photoCards.length;
      
      // Animate current out
      currentCard.style.transition = 'all 300ms ease-out';
      currentCard.style.opacity = '0';
      currentCard.style.transform = `translateX(${-direction * 50}px) scale(0.9)`;
      
      setTimeout(() => {
        // Reset current
        currentCard.style.left = currentCard.dataset.origLeft;
        currentCard.style.top = currentCard.dataset.origTop;
        currentCard.style.transform = currentCard.dataset.origTransform;
        currentCard.style.zIndex = currentCard.dataset.origZIndex;
        currentCard.style.padding = '';
        currentCard.style.opacity = '1';
        currentCard.classList.remove('zoomed');
        
        const currentImg = currentCard.querySelector('img');
        currentImg.style.maxWidth = '';
        currentImg.style.maxHeight = '';
        
        // Expand new
        expandedIndex = newIndex;
        const newCard = photoCards[expandedIndex];
        expandPhoto(newCard);
      }, 300);
    }
    
    // ===== Render Photos =====
    function renderPhotos() {
      canvas.innerHTML = '';
      photoCards = [];
      expandedIndex = -1;
      
      currentPhotos = getRandomPhotos(6);
      
      currentPhotos.forEach((photo, index) => {
        const card = createPhotoCard(photo, index, currentPhotos.length);
        canvas.appendChild(card);
        photoCards.push(card);
      });
    }
    
    // ===== Reset Layout =====
    function resetLayout() {
      if (expandedIndex !== -1) {
        collapsePhoto();
        return;
      }
      
      photoCards.forEach((card, index) => {
        const pos = getRandomPosition(index, photoCards.length);
        const rotation = getRandomRotation();
        
        card.style.transition = 'all 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94)';
        card.dataset.rotation = rotation;
        card.style.left = `${pos.x}px`;
        card.style.top = `${pos.y}px`;
        card.style.transform = `rotate(${rotation}deg)`;
        card.style.zIndex = zIndexCounter++;
        
        setTimeout(() => {
          card.style.transition = '';
        }, 600);
      });
    }
    
    // ===== Event Listeners =====
    document.addEventListener('mousemove', handleMouseMove);
    document.addEventListener('mouseup', handleMouseUp);
    document.addEventListener('touchmove', handleTouchMove, { passive: false });
    document.addEventListener('touchend', handleTouchEnd);
    
    closeBtn.addEventListener('click', collapsePhoto);
    expandedBg.addEventListener('click', collapsePhoto);
    
    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      navigateExpanded(-1);
    });
    
    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      navigateExpanded(1);
    });
    
    document.getElementById('resetBtn').addEventListener('click', resetLayout);
    document.getElementById('shuffleBtn').addEventListener('click', renderPhotos);
    
    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (expandedIndex === -1) return;
      
      switch (e.key) {
        case 'Escape':
          collapsePhoto();
          break;
        case 'ArrowLeft':
          navigateExpanded(-1);
          break;
        case 'ArrowRight':
          navigateExpanded(1);
          break;
      }
    });
    
    // Prevent image drag
    document.addEventListener('dragstart', (e) => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });
    
    // Initialize
    renderPhotos();
  </script>
</body>
</html>
